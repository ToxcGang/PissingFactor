name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lua syntax and gameplay tests
        run: python tools/test.py
      - name: Package and release-gate tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Configuration and source validation
        run: python tools/verify.py
